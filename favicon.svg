<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App-icon background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="1" y="1" width="30" height="30" rx="7.2"
        fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

  <!-- Shield with gold gradient -->
  <path d="M16 4.5L7.5 8.2v6.8C7.5 21 11 26.5 16 28.5C21 26.5 24.5 21 24.5 15V8.2L16 4.5Z"
        fill="url(#shieldGrad)" opacity="0.97"/>
  <path d="M16 4.5L7.5 8.2v6.8C7.5 21 11 26.5 16 28.5C21 26.5 24.5 21 24.5 15V8.2L16 4.5Z"
        fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="0.6"/>

  <!-- "10" big number inside shield -->
  <text x="16" y="20.6" text-anchor="middle"
        font-family="Inter, Arial, sans-serif" font-weight="900"
        font-size="12" fill="#1e3a8a" letter-spacing="-0.5"
        filter="url(#glow)">10</text>

  <!-- RU badge top-right -->
  <circle cx="25.5" cy="7" r="3.6" fill="#dc2626" stroke="#fff" stroke-width="0.9"/>
  <text x="25.5" y="8.5" text-anchor="middle"
        font-family="Inter, Arial, sans-serif" font-weight="800"
        font-size="3.6" fill="#fff" letter-spacing="-0.1">RU</text>

  <!-- Subtle highlight on top -->
  <path d="M16 6L9 9v5" fill="none"
        stroke="rgba(255,255,255,0.42)" stroke-width="0.8" stroke-linecap="round"/>
</svg>
